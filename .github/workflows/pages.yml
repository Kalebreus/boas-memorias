name: Publicar site no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
      - name: Preparar os arquivos do Pages
        uses: actions/configure-pages@v5
      - name: Enviar o front-end
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publicar no Pages
        id: deployment
        uses: actions/deploy-pages@v4
